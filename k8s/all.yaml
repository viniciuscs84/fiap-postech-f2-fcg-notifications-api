apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificationsapi
  namespace: fcg-phase2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notificationsapi
  template:
    metadata:
      labels:
        app: notificationsapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: notificationsapi
          image: viniciuscs84/fcg-notifications-api:sha-ec4124d7091ccde013047bcf80aa5ed09fe1f06c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fcg-config
          env:
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notificationsapi
  namespace: fcg-phase2
spec:
  selector:
    app: notificationsapi
  ports:
    - name: http
      port: 8080
      targetPort: http
